  .mincho{font-family:"Shippori Mincho B1",serif}
  header{background:var(--char);color:#f2ece1;padding:12px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--salmon)}
  .logo-img{height:44px;width:auto;display:block}
  .brand{display:flex;flex-direction:column;line-height:1.2;border-left:1px solid #575757;padding-left:14px}
  .brand .jp{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:16px;letter-spacing:.14em;color:#f6f0e6}
  .brand .sub{font-size:9.5px;color:#a89f92;letter-spacing:.2em}
  .savebox{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#a89f92}
  .dot{width:8px;height:8px;border-radius:50%;background:#6a6a6a}
  .savebox.saving .dot{background:var(--tamago)}
  .savebox.saved .dot{background:var(--good)}
  .savebox.err .dot{background:var(--over)}
  nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:71px;z-index:15}
  nav.tabs button{flex:1;background:none;border:none;padding:13px 6px 11px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
  nav.tabs button .cnt{font-size:10px;font-weight:500;color:var(--muted)}
  nav.tabs button.active{color:var(--salmon-deep);border-bottom-color:var(--salmon)}
  main{max-width:940px;margin:0 auto;padding:18px 16px 90px}
  .panel{display:none}.panel.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 14px;gap:10px}
  .panel-head h2{font-family:"Shippori Mincho B1",serif;font-size:19px;margin:0;letter-spacing:.05em}
  .panel-head .hint{font-size:12px;color:var(--muted);text-align:right}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .card-body{padding:14px}
  .cat-head{background:#efe7d6;color:#6d5f4f;font-weight:700;font-size:12px;letter-spacing:.08em;padding:8px 14px;display:flex;gap:8px;border-top:1px solid var(--line)}
  .cat-head:first-child{border-top:none}
  .cat-head span{background:#fff;color:var(--muted);border-radius:20px;padding:1px 8px;font-size:10px}
  .lbl-row{display:grid;grid-template-columns:1fr 74px 58px 88px 32px;gap:8px;padding:8px 14px 4px;font-size:10px;color:var(--muted)}
  .ing{display:grid;grid-template-columns:1fr 74px 58px 88px 32px;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
  .ing-meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-2px}
  .unitcost{font-size:11px;color:var(--muted)}
  .catsel{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:#fff}
  input,select{font-family:inherit}
  .fld{border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:14px;background:#fff;color:var(--ink);width:100%}
  .fld:focus{outline:none;border-color:var(--salmon);box-shadow:0 0 0 3px var(--salmon-soft)}
  .fld.num{text-align:right}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px;border-radius:6px}
  .del:hover{color:var(--over);background:#f8e9e8}
  .add-row{display:flex;gap:8px;padding:12px;background:#faf6ec;border-top:1px dashed var(--line)}
  .btn{font-family:inherit;font-weight:700;border-radius:10px;cursor:pointer;border:none;padding:10px 16px;font-size:14px}
  .btn-primary{background:var(--salmon);color:#fff}.btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:#fff;color:var(--salmon-deep);border:1px solid var(--salmon-soft)}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .menu-top{display:flex;gap:10px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}
  .menu-name{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:16px;border:1px solid transparent;background:none;width:100%;padding:4px 6px;border-radius:8px}
  .menu-name:focus{outline:none;border-color:var(--salmon);background:#fff}
  .price-wrap{display:flex;align-items:center;gap:4px}.price-wrap .yen{color:var(--muted);font-size:13px;white-space:nowrap}
  .metrics{display:flex;background:#faf6ec;border-bottom:1px solid var(--line)}
  .metric{flex:1;text-align:center;padding:11px 4px;border-right:1px solid var(--line)}.metric:last-child{border-right:none}
  .metric .k{font-size:10px;color:var(--muted);margin-bottom:3px}
  .metric .v{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px}
  .metric .v small{font-size:11px;font-weight:500;color:var(--muted)}
  .rate-good{color:var(--good)}.rate-over{color:var(--over)}
  .comp{display:grid;grid-template-columns:1fr 70px 42px 80px 30px;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .comp .cunit{color:var(--muted);font-size:12px;text-align:center}.comp .ccost{text-align:right;font-weight:700}
  .comp.missing .cname{color:var(--over)}
  .comp-add{display:flex;gap:8px;padding:11px 14px}.comp-add select{flex:1}
  .empty{text-align:center;padding:38px 20px;color:var(--muted)}
  .empty .big{font-family:"Shippori Mincho B1",serif;font-size:16px;color:var(--ink);margin-bottom:6px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;box-shadow:var(--shadow);text-align:center}
  .kpi .k{font-size:11px;color:var(--muted);margin-bottom:6px}
  .kpi .v{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:26px}
  .kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
  .bars .row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .bars .row:last-child{border-bottom:none}
  .bars .rn{width:36%;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars .track{flex:1;height:16px;background:#efe7d6;border-radius:8px;overflow:hidden}
  .bars .fill{height:100%;border-radius:8px;transition:width .4s}
  .bars .rp{width:52px;text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  table.sum{width:100%;border-collapse:collapse;font-size:13px}
  table.sum th,table.sum td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
  table.sum th{color:var(--muted);font-size:11px;font-weight:700}
  table.sum td.name,table.sum th.name{text-align:left}
  .target-in{width:64px;text-align:right}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--char);color:#f6f0e6;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .banner{background:#fff6e5;border:1px solid #f0dfa8;color:#8a6d1f;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
  .gate{position:fixed;inset:0;z-index:100;background:var(--char);display:flex;align-items:center;justify-content:center;padding:24px}
  .gatebox{background:var(--card);border-radius:18px;padding:30px 26px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .gatebox img{height:50px;margin-bottom:10px}
  .gate-t{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px;letter-spacing:.1em;margin-bottom:4px}
  .gate-m{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .gate-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px;text-align:center;letter-spacing:.2em;margin-bottom:10px;font-family:inherit}
  .gate-in:focus{outline:none;border-color:var(--salmon);box-shadow:0 0 0 3px var(--salmon-soft)}
  .gate-btn{width:100%;background:var(--salmon);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .gate-err{color:var(--over);font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}
  .lockbtn{background:none;border:none;color:#a89f92;cursor:pointer;font-size:14px;padding:2px 6px;margin-left:6px}
  @media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpi:first-child{grid-column:1/-1}.ing,.lbl-row{grid-template-columns:1fr 60px 50px 74px 28px;gap:6px}.fld{padding:8px 7px;font-size:13px}.comp{grid-template-columns:1fr 58px 38px 68px 26px;gap:6px}.brand .jp{font-size:14px}.logo-img{height:38px}}
</style>
</head>

const SEED_ING=[["メイプルサーモン","サーモン・魚介",20970,10000,"g"],["01鮭パウダー","サーモン・魚介",20800,990,"g"],["ランプフィッシュキャビア","サーモン・魚介",650,50,"g"],["甘エビ","サーモン・魚介",1532,1000,"g"],["海老ベース","サーモン・魚介",698,1,"個"],["鶏胸肉","肉",650,1000,"g"],["豚肩ロース","肉",950,1000,"g"],["豚挽肉","肉",650,1000,"g"],["和牛","肉",3800,2000,"g"],["鹿肉ロースト","肉",3300,1,"個"],["李錦記オイスターソース","調味料・オイル",1518,750,"g"],["フィッシュソース(ナンプラー)","調味料・オイル",544,725,"ml"],["RFパルメザンパウダー","調味料・オイル",2320,1000,"g"],["ミックスチーズ(シュレッド)","調味料・オイル",1350,1000,"g"],["サラダ油","調味料・オイル",5800,16500,"g"],["白トリュフオイル","調味料・オイル",1530,250,"ml"],["オリーブオイル","調味料・オイル",1900,1000,"ml"],["黒胡椒ホール","調味料・オイル",356,100,"g"],["パプリカパウダー","調味料・オイル",611,225,"g"],["おろしニンニク","調味料・オイル",840,1000,"g"],["一味唐辛子","調味料・オイル",540,300,"g"],["糸唐辛子","調味料・オイル",1730,100,"g"],["朝天ラージャオメン(唐辛子)","調味料・オイル",1886,500,"g"],["ねりごま","調味料・オイル",1515,1000,"g"],["バジルペースト","調味料・オイル",2250,820,"g"],["ガーリックフレーク","調味料・オイル",2017,1000,"g"],["フライドガーリックフレーク","調味料・オイル",720,200,"g"],["バルサミコ","調味料・オイル",1750,380,"ml"],["だしご飯ベース","調味料・オイル",1549,1800,"ml"],["白だし","調味料・オイル",1262,1800,"ml"],["濃口醤油","調味料・オイル",544,1800,"ml"],["牡蠣だし醤油","調味料・オイル",340,400,"ml"],["伯方の塩","調味料・オイル",563,1000,"g"],["グラニュー糖","調味料・オイル",351,1000,"g"],["四川山椒油","調味料・オイル",2750,920,"g"],["食べるラー油","調味料・オイル",994,500,"g"],["いし本ラー油","調味料・オイル",2235,2000,"ml"],["フライドオニオン","調味料・オイル",1104,200,"g"],["マヨネーズ","調味料・オイル",658,1000,"g"],["コンソメ","調味料・オイル",7000,1000,"g"],["おろしわさび","調味料・オイル",815,500,"g"],["油缶","調味料・オイル",5600,2000,"g"],["冷凍キノコペースト","野菜・きのこ",1010,1000,"g"],["ごぼう","野菜・きのこ",188,2,"本"],["赤玉ねぎ","野菜・きのこ",238,1,"個"],["ジャガイモ","野菜・きのこ",680,1000,"g"],["水菜","野菜・きのこ",115,200,"g"],["レモン","野菜・きのこ",98,1,"個"],["ニンジン","野菜・きのこ",78,150,"g"],["しめじ","野菜・きのこ",178,200,"g"],["舞茸","野菜・きのこ",188,100,"g"],["ブロッコリースプラウト","野菜・きのこ",120,1,"個"],["蓮根","野菜・きのこ",1980,1000,"g"],["かぶ","野菜・きのこ",228,1,"個"],["卵","米・卵・乳",5280,10000,"g"],["無洗米","米・卵・乳",13889,25000,"g"],["豆乳","米・卵・乳",245,1000,"ml"],["石窯バゲット","米・卵・乳",268,213,"g"],["白ワイン","ドリンク",1724,1,"本"],["コーラ","ドリンク",116,1,"本"],["オレンジジュース","ドリンク",93,1,"本"],["ジンジャエール","ドリンク",107,1,"本"],["アサヒスーパードライ","ドリンク",208,1,"本"],["黒烏龍茶","ドリンク",548,1,"袋"],["ハイボール","ドリンク",153,1,"本"],["レモンサワー","ドリンク",131,1,"本"],["サッポロ","ドリンク",208,1,"本"]];
const SEED_MENU=[["サーモン担担麺",1400,[]],["赤辛サーモン",1100,[]],["バジルサーモン",1200,[]],["コーラ",350,[["コーラ",1]]],["オレンジジュース",350,[["オレンジジュース",1]]],["ジンジャエール",350,[["ジンジャエール",1]]],["アサヒスーパードライ",650,[["アサヒスーパードライ",1]]],["ハイボール",500,[["ハイボール",1]]],["レモンサワー",500,[["レモンサワー",1]]],["サッポロ",650,[["サッポロ",1]]]];
function buildSeed(){return {ingredients:SEED_ING.map(r=>({name:r[0],cat:r[1],price:r[2],amount:r[3],unit:r[4]})),menus:SEED_MENU.map(m=>({name:m[0],price:m[1],components:m[2].map(c=>({ingName:c[0],qty:c[1]}))})),target:30};}

/* ---------- helpers ---------- */
const yen=n=>"¥"+Math.round(n).toLocaleString('ja-JP');
const yen2=n=>"¥"+(Math.round(n*100)/100).toLocaleString('ja-JP',{maximumFractionDigits:2});
function fmtNum(v){if(v===''||v==null)return '';const n=Number(String(v).replace(/,/g,''));return isNaN(n)?v:n.toLocaleString('ja-JP',{maximumFractionDigits:4});}
function cleanNum(v){return String(v).replace(/,/g,'');}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function findIng(name){return state.ingredients.find(i=>i.name===name);}
function unitCost(ing){const a=parseFloat(ing.amount),p=parseFloat(ing.price);if(!a||a<=0||isNaN(p))return 0;return p/a;}
function menuCost(m){let c=0;for(const comp of m.components){const ing=findIng(comp.ingName);if(ing)c+=unitCost(ing)*(parseFloat(comp.qty)||0);}return c;}

/* ---------- save ---------- */
function setSave(cls,txt){const b=document.getElementById('savebox');b.className='savebox '+cls;document.getElementById('savetext').textContent=txt;}
function scheduleSave(){setSave('saving','保存中');clearTimeout(saveTimer);saveTimer=setTimeout(doSave,700);}
function doSave(){apiSave(state).then(()=>setSave('saved','保存済み')).catch(()=>setSave('err','保存できません'));}

/* ---------- 材料 ---------- */
function catOptions(sel){return CATS.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');}
function ingRow(ing){
  const uc=unitCost(ing);const uOpts=UNITS.map(u=>`<option ${u===ing.unit?'selected':''}>${u}</option>`).join('');
  const i=state.ingredients.indexOf(ing);
  return `<div class="ing">
    <input class="fld" value="${esc(ing.name)}" placeholder="材料名" data-i="${i}" oninput="renameIng(${i},this.value)">
    <input class="fld num" value="${fmtNum(ing.amount)}" inputmode="decimal" placeholder="量" onfocus="this.value=cleanNum(this.value)" onblur="this.value=fmtNum(this.value)" oninput="upIng(${i},'amount',cleanNum(this.value))">
    <select class="fld" onchange="upIng(${i},'unit',this.value)">${uOpts}</select>
    <input class="fld num" value="${fmtNum(ing.price)}" inputmode="decimal" placeholder="価格" onfocus="this.value=cleanNum(this.value)" onblur="this.value=fmtNum(this.value)" oninput="upIng(${i},'price',cleanNum(this.value))">
    <button class="del" onclick="delIng(${i})">×</button>
    <div class="ing-meta"><span class="unitcost" id="uc-${i}">${uc?`単価 ${yen2(uc)} / ${ing.unit}`:'量と価格で単価が出ます'}</span>
      <select class="catsel" onchange="upIng(${i},'cat',this.value)">${catOptions(ing.cat||'その他')}</select></div>
  </div>`;
}
function renderIng(){
  const el=document.getElementById('ingList');
  const bn=document.getElementById('ingBanner');
  bn.innerHTML = HAS_API ? '' : '<div class="banner">接続先URLが未設定のプレビュー表示です（この端末に一時保存）。導入ガイドの通りURLを設定するとスプレッドシートと同期します。</div>';
  if(!state.ingredients.length){
    el.innerHTML=`<div class="empty"><div class="big">まだ材料がありません</div><button class="btn btn-ghost btn-sm" onclick="seed()">原価表を読み込む</button></div>`;
  }else{
    let h='';CATS.forEach(cat=>{const items=state.ingredients.filter(i=>(i.cat||'その他')===cat);if(!items.length)return;h+=`<div class="cat-head">${cat}<span>${items.length}</span></div>`+items.map(ingRow).join('');});el.innerHTML=h;
  }
  document.getElementById('cntIng').textContent=state.ingredients.length?`(${state.ingredients.length})`:'';
}
function addIng(){state.ingredients.push({name:"",cat:"その他",amount:"",unit:"g",price:""});renderIng();scheduleSave();}
function upIng(i,f,v){const ing=state.ingredients[i];if(!ing)return;ing[f]=v;
  if(f==='cat'){renderIng();scheduleSave();return;}
  const uc=unitCost(ing),el=document.getElementById('uc-'+i);if(el)el.textContent=uc?`単価 ${yen2(uc)} / ${ing.unit}`:'量と価格で単価が出ます';
  renderMenusLive();scheduleSave();}
function renameIng(i,v){const ing=state.ingredients[i];if(!ing)return;const old=ing.name;ing.name=v;
  state.menus.forEach(m=>m.components.forEach(c=>{if(c.ingName===old)c.ingName=v;}));scheduleSave();}
function delIng(i){const ing=state.ingredients[i];const used=state.menus.some(m=>m.components.some(c=>c.ingName===ing.name));
  if(used&&!confirm(`「${ing.name||'この材料'}」はメニューで使われています。削除しますか？`))return;
  state.ingredients.splice(i,1);renderIng();renderMenus();scheduleSave();}

/* ---------- メニュー ---------- */
function ingOptsHTML(){let h='<option value="">＋ 材料を選ぶ</option>';CATS.forEach(cat=>{const items=state.ingredients.filter(i=>(i.cat||'その他')===cat);if(!items.length)return;h+=`<optgroup label="${cat}">`+items.map(i=>`<option value="${esc(i.name)}">${esc(i.name||'(無名)')}</option>`).join('')+`</optgroup>`;});return h;}
function menuCardHTML(m,j){
  const cost=menuCost(m),price=parseFloat(m.price)||0,rate=price>0?cost/price*100:0,profit=price-cost;
  const over=price>0&&rate>state.target,rateCls=price<=0?'':(over?'rate-over':'rate-good');
  const comps=m.components.length?m.components.map((c,k)=>{const ing=findIng(c.ingName),uc=ing?unitCost(ing):0,cc=uc*(parseFloat(c.qty)||0);
    if(!ing)return `<div class="comp missing"><span class="cname">(見つからない材料)</span><span></span><span></span><span class="ccost">—</span><button class="del" onclick="delComp(${j},${k})">×</button></div>`;
    return `<div class="comp"><span class="cname">${esc(ing.name)}</span><input class="fld num" value="${fmtNum(c.qty)}" inputmode="decimal" placeholder="量" onfocus="this.value=cleanNum(this.value)" onblur="this.value=fmtNum(this.value)" oninput="upComp(${j},${k},cleanNum(this.value))"><span class="cunit">${ing.unit}</span><span class="ccost">${yen(cc)}</span><button class="del" onclick="delComp(${j},${k})">×</button></div>`;}).join(''):`<div style="padding:12px 14px;color:var(--muted);font-size:13px">下の欄から材料を追加してください。</div>`;
  return `<div class="card" data-j="${j}">
    <div class="menu-top"><div style="flex:1"><input class="menu-name" value="${esc(m.name)}" placeholder="メニュー名" oninput="upMenu(${j},'name',this.value)"></div>
      <div class="price-wrap"><span class="yen">売価 ¥</span><input class="fld num" style="width:82px" value="${fmtNum(m.price)}" inputmode="decimal" placeholder="0" onfocus="this.value=cleanNum(this.value)" onblur="this.value=fmtNum(this.value)" oninput="upMenu(${j},'price',cleanNum(this.value))"></div>
      <button class="del" onclick="delMenu(${j})">×</button></div>
    <div class="metrics">
      <div class="metric"><div class="k">原価</div><div class="v" data-m="cost">${yen(cost)}</div></div>
      <div class="metric"><div class="k">原価率</div><div class="v ${rateCls}" data-m="rate">${price>0?rate.toFixed(1)+'<small>%</small>':'—'}</div></div>
      <div class="metric"><div class="k">粗利</div><div class="v" data-m="profit">${price>0?yen(profit):'—'}</div></div></div>
    <div data-comps>${comps}</div>
    <div class="comp-add"><select class="fld" onchange="addComp(${j},this.value);this.value='';">${ingOptsHTML()}</select></div>
  </div>`;
}
function renderMenus(){const el=document.getElementById('menuList');
  if(!state.menus.length){el.innerHTML=`<div class="card"><div class="empty"><div class="big">まだメニューがありません</div>「メニューを追加」で作成できます。</div></div>`;}
  else el.innerHTML=state.menus.map((m,j)=>menuCardHTML(m,j)).join('');
  document.getElementById('cntMenu').textContent=state.menus.length?`(${state.menus.length})`:'';}
function addMenu(){if(!state.ingredients.length){toast("先に材料を登録してください");switchTab('ing');return;}state.menus.push({name:"",price:"",components:[]});renderMenus();scheduleSave();}
function upMenu(j,f,v){const m=state.menus[j];if(!m)return;m[f]=v;refreshCard(j);scheduleSave();}
function delMenu(j){const m=state.menus[j];if(!confirm(`「${m.name||'このメニュー'}」を削除しますか？`))return;state.menus.splice(j,1);renderMenus();scheduleSave();}
function addComp(j,ingName){if(!ingName)return;state.menus[j].components.push({ingName,qty:""});renderMenus();scheduleSave();}
function upComp(j,k,v){const c=state.menus[j].components[k];if(!c)return;c.qty=v;refreshCard(j);scheduleSave();}
function delComp(j,k){state.menus[j].components.splice(k,1);renderMenus();scheduleSave();}
function refreshCard(j){const m=state.menus[j];const card=document.querySelector(`[data-j="${j}"]`);if(!card)return;
  const cost=menuCost(m),price=parseFloat(m.price)||0,rate=price>0?cost/price*100:0,profit=price-cost,over=price>0&&rate>state.target;
  card.querySelector('[data-m="cost"]').textContent=yen(cost);
  const r=card.querySelector('[data-m="rate"]');r.innerHTML=price>0?rate.toFixed(1)+'<small>%</small>':'—';r.className='v '+(price<=0?'':(over?'rate-over':'rate-good'));
  card.querySelector('[data-m="profit"]').textContent=price>0?yen(profit):'—';
  card.querySelectorAll('[data-comps] .comp').forEach((row,k)=>{const c=m.components[k];if(!c)return;const ing=findIng(c.ingName);if(!ing)return;const ce=row.querySelector('.ccost');if(ce)ce.textContent=yen(unitCost(ing)*(parseFloat(c.qty)||0));});}
function renderMenusLive(){state.menus.forEach((m,j)=>refreshCard(j));}

/* ---------- 結果まとめ ---------- */
function renderSum(){
  document.getElementById('targetInput').value=state.target;
  const el=document.getElementById('sumBody');
  const priced=state.menus.filter(m=>(parseFloat(m.price)||0)>0&&m.components.length>0);
  if(!priced.length){el.innerHTML=`<div class="card"><div class="empty"><div class="big">集計するデータがありません</div>売価と材料の入ったメニューがここにまとまります。</div></div>`;return;}
  const rows=priced.map(m=>{const cost=menuCost(m),price=parseFloat(m.price);return{name:m.name||'(無名)',cost,price,rate:cost/price*100,profit:price-cost};});
  const avg=rows.reduce((s,r)=>s+r.rate,0)/rows.length,overCnt=rows.filter(r=>r.rate>state.target).length;
  const sorted=[...rows].sort((a,b)=>b.rate-a.rate),maxRate=Math.max(...rows.map(r=>r.rate),state.target)*1.1;
  el.innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="k">平均原価率</div><div class="v ${avg>state.target?'rate-over':'rate-good'}">${avg.toFixed(1)}<small>%</small></div></div>
      <div class="kpi"><div class="k">集計メニュー</div><div class="v">${rows.length}<small>品</small></div></div>
      <div class="kpi"><div class="k">目標超過</div><div class="v ${overCnt?'rate-over':'rate-good'}">${overCnt}<small>品</small></div></div>
    </div>
    <div class="card"><div class="card-body"><div style="font-size:12px;color:var(--muted);margin-bottom:8px">原価率が高い順（赤は目標 ${state.target}％ 超過）</div>
      <div class="bars">${sorted.map(r=>{const over=r.rate>state.target,w=Math.min(100,r.rate/maxRate*100);return `<div class="row"><div class="rn">${esc(r.name)}</div><div class="track"><div class="fill" style="width:${w}%;background:${over?'var(--over)':'var(--good)'}"></div></div><div class="rp" style="color:${over?'var(--over)':'var(--good)'}">${r.rate.toFixed(1)}%</div></div>`;}).join('')}</div>
    </div></div>
    <div class="card"><div class="card-body"><table class="sum"><thead><tr><th class="name">メニュー</th><th>売価</th><th>原価</th><th>原価率</th><th>粗利</th></tr></thead><tbody>
      ${sorted.map(r=>`<tr><td class="name">${esc(r.name)}</td><td>${yen(r.price)}</td><td>${yen(r.cost)}</td><td style="color:${r.rate>state.target?'var(--over)':'var(--good)'};font-weight:700">${r.rate.toFixed(1)}%</td><td>${yen(r.profit)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

/* ---------- misc ---------- */
function seed(){if((state.ingredients.length||state.menus.length)&&!confirm("原価表を読み込みます。現在の内容は置き換わります。よろしいですか？"))return;state=buildSeed();renderAll();scheduleSave();toast("原価表を読み込みました");}
function renderAll(){renderIng();renderMenus();renderSum();document.getElementById('targetInput').value=state.target;}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function switchTab(name){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));if(name==='sum')renderSum();}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
document.getElementById('targetInput').addEventListener('input',e=>{const v=parseFloat(e.target.value);state.target=isNaN(v)?0:v;renderMenus();renderSum();scheduleSave();});

/* ---------- 合言葉ゲート ＋ 起動 ---------- */
function applyData(d){
  if(d && d.ingredients && (d.ingredients.length || d.menus.length)){
    state = { ingredients:d.ingredients||[], menus:(d.menus||[]).map(function(m){return {name:m.name,price:m.price,components:m.components||[]};}), target:d.target||30 };
  }
  setSave('saved','保存済み'); renderAll();
}
function boot(){
  apiGet().then(function(d){
    if(d && d.error){ showGate(); return; }
    applyData(d);
  }).catch(function(){ setSave('err','読み込み失敗'); renderAll(); });
}
function showGate(){ document.getElementById('gate').style.display='flex'; setTimeout(function(){ document.getElementById('gateIn').focus(); },60); }
function hideGate(){ document.getElementById('gate').style.display='none'; }
function lockNow(){ try{ localStorage.removeItem('salmon-gate'); }catch(e){} location.reload(); }
function tryPass(){
  var code=document.getElementById('gateIn').value; var err=document.getElementById('gateErr');
  if(!code){ err.textContent='合言葉を入力してください'; return; }
  err.textContent='確認中…'; __PASS = code;
  apiGet().then(function(d){
    if(d && d.error){ err.textContent='合言葉が違います'; document.getElementById('gateIn').value=''; __PASS=null; return; }
    try{ localStorage.setItem('salmon-gate', code); }catch(e){}
    hideGate(); applyData(d);
  }).catch(function(){ err.textContent='確認できませんでした'; __PASS=null; });
}
document.getElementById('gateBtn').addEventListener('click', tryPass);
document.getElementById('gateIn').addEventListener('keydown', function(e){ if(e.key==='Enter') tryPass(); });

if(!HAS_API){
  boot(); // URL未設定（プレビュー）は合言葉なしで表示
}else{
  var saved=null; try{ saved=localStorage.getItem('salmon-gate'); }catch(e){}
  if(saved){ __PASS=saved; apiGet().then(function(d){ if(d&&d.error){ __PASS=null; showGate(); } else { applyData(d); } }).catch(function(){ showGate(); }); }
  else { showGate(); }
}
</script>
